<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11100e">
  <meta name="color-scheme" content="dark">
  <!-- iPad "Add to Home Screen" -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="45 Days">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>45 Days — Workout Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <nav class="nav" id="nav" aria-label="Main">
      <div class="brand">
        <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="18" fill="none" stroke="#34302a" stroke-width="6"/><path d="M24 6 a18 18 0 1 1 -17.1 23.6" fill="none" stroke="#e0662d" stroke-width="6" stroke-linecap="round"/><circle cx="24" cy="24" r="5" fill="#e3a92f"/></svg>
        <span>45 Days</span>
      </div>
      <a href="#today" data-view="today"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span>Today</span><kbd>1</kbd></a>
      <a href="#calendar" data-view="calendar"><svg viewBox="0 0 24 24"><path d="M4 6h16v14H4zM4 10h16M8 3v5M16 3v5"/></svg><span>Calendar</span><kbd>2</kbd></a>
      <a href="#checklist" data-view="checklist"><svg viewBox="0 0 24 24"><path d="M4 6l2 2 4-4M4 13l2 2 4-4M4 20l2 2 4-4M13 6h7M13 13h7M13 20h7"/></svg><span>Checklist</span><kbd>3</kbd></a>
      <a href="#body" data-view="body"><svg viewBox="0 0 24 24"><path d="M3 19l5-6 4 3 5-7 4 5M3 4v16h18"/></svg><span>Body</span><kbd>4</kbd></a>
      <a href="#guide" data-view="guide"><svg viewBox="0 0 24 24"><path d="M12 21a9 9 0 100-18 9 9 0 000 18zM10 8.5v7l6-3.5z"/></svg><span>Guide</span><kbd>5</kbd></a>
      <a href="#weekly" data-view="weekly"><svg viewBox="0 0 24 24"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/></svg><span>Weekly</span><kbd>6</kbd></a>
      <a href="#settings" data-view="settings"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6zM19 12l2-1-1-3-2 .2-1.3-1.4.3-2-3-1-1 2h-2l-1-2-3 1 .3 2L6 7.2 4 7 3 10l2 1v2l-2 1 1 3 2-.2 1.3 1.4-.3 2 3 1 1-2h2l1 2 3-1-.3-2 1.3-1.4 2 .2 1-3-2-1z"/></svg><span>Data &amp; settings</span><kbd>7</kbd></a>
    </nav>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="player" class="player" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:2rem">This app needs JavaScript turned on.</p></noscript>
  <script src="config.js"></script>
  <script src="session.js"></script>
  <script src="app.js"></script>
</body>
</html>
